# Auto-tune: MAD Polar XC5000 345KV + HQProp 13x10x3 on ARK 12S CAN.
# Hard caps: probe/finals ≤ 65% throttle; EEPROM max_ramp stays ≤ 2.0 %/ms
# (current page is 0.5 %/ms). The physics ramp stage is omitted so we never
# flash max_ramp=255 or snap to 0.95.
name: g431-345kv-13x10
description: >
  Tune advance/pwm/mode/min_duty for MAD Polar XC5000 345KV + HQProp 13x10x3
  @ 12S. Ceiling 65% (loaded smoke). max_ramp left at the on-chip 0.5 %/ms
  (under the 2 %/ms cap).

battery_cells: 12

pack:
  min_resting_cell_v: 3.5
  prompt_on_swap: true

thermal:
  max_start_fet_temp_c: 60.0

probe:
  points: {t20: 0.20, t30: 0.30, t40: 0.40, t50: 0.50, t60: 0.60, t65: 0.65}
  dwell_s: 4.0
  safety:
    # Smoke 65%: 23 A / 3.6 kgf / 7.8k RPM. RPM abort is high so a single
    # optical glitch (~21k) cannot kill a trial; throttle is still capped.
    max_current_a: 45.0
    max_thrust_n: 55.0
    max_rpm: 25000

objective:
  weights: {t20: 1.0, t30: 2.0, t40: 2.0, t50: 1.5, t60: 1.0, t65: 0.5}
  min_power_w: 20.0
  noise_floor_pct: 2.0

constraints:
  max_demag_events: 0
  max_bemf_timeout_samples: 0
  jitter_max_regression_pct: 25.0
  max_fet_temp_c: 95.0
  max_motor_temp_c: 100.0
  startup:
    cycles: 5
    max_failed: 0
    spin_throttle: 0.12
    min_rpm: 400

anchors_every: 6

parameters:
  advance_level:
    values: [14, 18, 22, 26, 30, 34, 38]
    refine_step: 2
  pwm_frequency:
    values: [8, 16, 24, 48]
  variable_pwm: {values: [0, 1, 2]}
  auto_advance: {values: [0, 1]}

stages:
  - name: advance
    sweep: advance_level
    search: climb
  - name: pwm
    sweep: pwm_frequency
    search: climb
    fixed: {variable_pwm: 0}
  - name: modes
    ab_candidates:
      - {}
      - {variable_pwm: 1}
      - {variable_pwm: 2}
      - {auto_advance: 1}
    repeats: 2
  - name: advance_polish
    sweep: advance_level
    search: climb
    polish_radius: 4
  - name: min_duty
    measure: min_duty
    margin: 1.15

finals:
  profile: tune_probe
  pattern: ABBA
  repeats: 1
  extra_repeats_if_close: 1
  min_delta_pct: 1.0
  startup_check: true
  high_throttle: 0.65
  high_throttle_dwell_s: 4.0
