name: noprop_startup_160kv_quick
description: >
  Short cold-start check at 8% and 12% for CR Systems 10025 Pro 160KV.
sample_rate_hz: 100
arm_settle_s: 3.0
pole_pairs: 21
steady_tail_fraction: 0.5

safety:
  max_current_a: 80.0
  max_thrust_n: 8.0
  max_rpm: 5000
  max_motor_temp_c: 80.0

segments:
  - {label: idle, throttle: 0.00, duration_s: 2.0}
  - {label: start08a, throttle: 0.08, duration_s: 3.0}
  - {label: off08a,   throttle: 0.00, duration_s: 3.0}
  - {label: start08b, throttle: 0.08, duration_s: 3.0}
  - {label: off08b,   throttle: 0.00, duration_s: 3.0}
  - {label: start08c, throttle: 0.08, duration_s: 3.0}
  - {label: off08c,   throttle: 0.00, duration_s: 3.0}
  - {label: start12a, throttle: 0.12, duration_s: 3.0}
  - {label: off12a,   throttle: 0.00, duration_s: 3.0}
  - {label: start12b, throttle: 0.12, duration_s: 3.0}
  - {label: stop,     throttle: 0.00, duration_s: 2.0}
