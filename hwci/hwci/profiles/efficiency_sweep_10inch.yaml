name: efficiency_sweep_10inch
description: >
  efficiency_sweep for the heavy-prop bench (900KV + HQProp 10x5x3, 6S): the
  same 6 s steady staircase, capped at 70% throttle and with safety limits
  sized for the 10" load (the tuner's ark4in1-900kv-10inch probe ceiling and
  limits). efficiency_sweep itself runs to 100% with 40 A / 16 N cutoffs sized
  for the 5" setup, so it aborts on this prop. Used as the steady-state arm of
  the upstream-vs-ARK32 A/B (hwci/docs/UPSTREAM_AB.md).
sample_rate_hz: 100
arm_settle_s: 2.0
steady_tail_fraction: 0.5

safety:
  max_current_a: 90.0
  max_thrust_n: 60.0
  max_rpm: 15000

segments:
  - {label: idle,   throttle: 0.00, duration_s: 2.0}
  - {label: t10,    throttle: 0.10, duration_s: 6.0, ramp: true,  steady: true}
  - {label: t20,    throttle: 0.20, duration_s: 6.0, steady: true}
  - {label: t30,    throttle: 0.30, duration_s: 6.0, steady: true}
  - {label: t40,    throttle: 0.40, duration_s: 6.0, steady: true}
  - {label: t50,    throttle: 0.50, duration_s: 6.0, steady: true}
  - {label: t60,    throttle: 0.60, duration_s: 6.0, steady: true}
  - {label: t70,    throttle: 0.70, duration_s: 6.0, steady: true}
  - {label: rampdn, throttle: 0.00, duration_s: 4.0, ramp: true}
