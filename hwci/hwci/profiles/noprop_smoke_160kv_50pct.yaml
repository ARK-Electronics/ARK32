name: noprop_smoke_160kv_50pct
description: >
  No-prop free-run climb to 50% on 8S for CR Systems 10025 Pro 160KV
  (42 poles / 21 pole-pairs). Free-run mech RPM ≈ 160 * Vbus * throttle:
  ~2.6k @ 50% on 32 V. Confirm prop is OFF before running.
sample_rate_hz: 100
arm_settle_s: 3.0
pole_pairs: 21
demag_rpm_drop_fraction: 0.25
demag_commutation_spike: 3.0
steady_tail_fraction: 0.5

safety:
  # 10025 open-loop start can pulse tens of amps with no prop.
  max_current_a: 80.0
  max_motor_temp_c: 80.0
  # 160KV * ~34 V * 1.0 ≈ 5.4k; 8k leaves headroom for optical glitches.
  max_rpm: 8000
  max_thrust_n: 8.0

smoke_gates:
  enabled: true
  min_throttle: 0.20
  min_running_fraction: 0.80
  max_bemf_latch_samples: 0
  require_esc_drive_states: true
  min_esc_drive_fraction: 0.80
  max_illegal_edges: 0
  min_rpm:
    0.10: 200
    0.25: 600
    0.50: 1500

segments:
  - {label: idle,    throttle: 0.00, duration_s: 2.0}
  - {label: ramp10,  throttle: 0.10, duration_s: 4.0, ramp: true}
  - {label: hold10,  throttle: 0.10, duration_s: 4.0, steady: true}
  - {label: ramp25,  throttle: 0.25, duration_s: 5.0, ramp: true}
  - {label: hold25,  throttle: 0.25, duration_s: 4.0, steady: true}
  - {label: ramp50,  throttle: 0.50, duration_s: 5.0, ramp: true}
  - {label: hold50,  throttle: 0.50, duration_s: 8.0, steady: true}
  - {label: rampdn,  throttle: 0.00, duration_s: 5.0, ramp: true}
  - {label: stop,    throttle: 0.00, duration_s: 2.0}
