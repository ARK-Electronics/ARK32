name: noprop_zc_map
description: >
  Free-run zero-cross map across eRPM: steady staircase 5%→100% with long
  enough holds for zc_jitter / confirm_reject / phase histogram stats.
  Primary filter-tuning dataset for ARK G431 CAN + high-KV no-prop.
  ~25 V / 3 A; max free-run ~41k RPM. ~2 min.
sample_rate_hz: 100
arm_settle_s: 3.0
steady_tail_fraction: 0.5
demag_rpm_drop_fraction: 0.30
demag_commutation_spike: 3.0

safety:
  max_current_a: 8.0
  max_thrust_n: 3.0
  max_rpm: 55000
  max_motor_temp_c: 90.0

segments:
  - {label: idle,   throttle: 0.00, duration_s: 2.0}
  - {label: t05,    throttle: 0.05, duration_s: 6.0, ramp: true,  steady: true}
  - {label: t10,    throttle: 0.10, duration_s: 6.0, steady: true}
  - {label: t15,    throttle: 0.15, duration_s: 6.0, steady: true}
  - {label: t20,    throttle: 0.20, duration_s: 6.0, steady: true}
  - {label: t30,    throttle: 0.30, duration_s: 6.0, steady: true}
  - {label: t40,    throttle: 0.40, duration_s: 6.0, steady: true}
  - {label: t50,    throttle: 0.50, duration_s: 6.0, steady: true}
  - {label: t60,    throttle: 0.60, duration_s: 6.0, steady: true}
  - {label: t70,    throttle: 0.70, duration_s: 6.0, steady: true}
  - {label: t80,    throttle: 0.80, duration_s: 6.0, steady: true}
  - {label: t90,    throttle: 0.90, duration_s: 6.0, steady: true}
  - {label: t100,   throttle: 1.00, duration_s: 6.0, steady: true}
  - {label: rampdn, throttle: 0.00, duration_s: 5.0, ramp: true}
  - {label: stop,   throttle: 0.00, duration_s: 2.0}
