# ARK 12S CAN ESC + AOS 2207 1980KV free-run (no prop) on Flight Stand SETUP A.
# Optical RPM (stand signal 15) works on this bell — independent mechanical
# truth for demag/RPM-collapse gates. ESC e_rpm over SWD is still on the perf
# channel for desync / estimate cross-checks during BEMF filter tuning.
#   hwci run --config config/rig.g431_1980kv_noprop.yaml --profile noprop_zc_map --battery-cells 6
target: ARK_G431_CAN
debugger_backend: openocd
openocd_bin: openocd
openocd_configs:
  - interface/stlink.cfg
  - target/stm32g4x.cfg
app_load_addr: 0x08004000
adapter_speed_khz: 8000
telem_backend: none
debug_uart_backend: serial
debug_uart_port: /dev/ttyACM0
debug_uart_baud: 115200
throttle_backend: flightstand
stand_backend: grpc
stand_host: 192.168.7.22
stand_port: 50051
stand_signals:
  thrust: 11
  torque: 14
  rpm: 15
  voltage: 6
  current: 8
  esc_output: 0
  esc_zero: 0.0
  esc_min: 48.0
  esc_max: 2047.0
  thrust_is_grams: false
  rpm_is_rad_per_s: true
  motor_temp: "/boards/COM3/inputs/29"
  fet_temp: "/boards/COM3/inputs/31"
motor_name: "AOS Supernova 2207 1980KV"
pole_pairs: 7
prop: "none"
