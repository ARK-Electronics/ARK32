name: SITL Tests

on:
  push:
    branches: ["main", "dakejahl/version-32"]
  pull_request:
    branches: ["main", "dakejahl/version-32"]
  workflow_call:
  workflow_dispatch:

jobs:
  sitl-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-eeprom

      - name: Build SITL
        run: make AM32_SITL_CAN

      - name: Install CI Python deps
        run: |
          python3 -m venv sitl-venv
          sitl-venv/bin/pip install -U pip
          sitl-venv/bin/pip install -r Mcu/SITL/requirements-ci.txt

      - name: Run SITL pytest suite
        env:
          SITL_REQUIRE_CAN: "1"
        run: |
          mkdir sitl_test_run && cd sitl_test_run
          ../sitl-venv/bin/python ../Mcu/SITL/run_ci_tests.py \
            --sitl ../obj/ARK32_AM32_SITL_CAN_*.elf \
            --junitxml=sitl-results.xml

      - name: Upload SITL log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sitl-test-log
          path: |
            sitl_test_run/sitl_ci.log
            sitl_test_run/**/sitl_ci.log
            sitl_test_run/sitl-results.xml
          if-no-files-found: ignore

      - name: Upload junit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitl-junit
          path: sitl_test_run/sitl-results.xml
          if-no-files-found: ignore

  upstream-compatibility:
    name: upstream SITL (${{ matrix.os }}, ${{ matrix.sanitizer || 'normal' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sanitizer: ''
          - os: ubuntu-latest
            sanitizer: address
          - os: ubuntu-latest
            sanitizer: undefined
          - os: macos-latest
            sanitizer: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned ESCSim revision
        id: escsim
        run: echo "ref=$(cat Mcu/SITL/escsim-revision.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out upstream SITL tools and tests
        uses: actions/checkout@v4
        with:
          repository: am32-firmware/ESCSim
          ref: ${{ steps.escsim.outputs.ref }}
          path: ESCSim
      - uses: ./.github/actions/setup-eeprom
      - name: Build upstream-compatible SITL
        run: make AM32_SITL_CAN SITL_SANITIZE="${{ matrix.sanitizer }}"
      - name: Install test dependencies
        run: |
          python3 -m venv upstream-venv
          upstream-venv/bin/pip install -r Mcu/SITL/requirements-ci.txt
      - name: Route macOS multicast to loopback
        if: runner.os == 'macOS'
        run: sudo route -n add -net 239.65.82.0/24 -interface lo0
      - name: Run upstream behavioral suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          mkdir upstream_test_run && cd upstream_test_run
          ../upstream-venv/bin/python ../Mcu/SITL/run_upstream_tests.py \
            --escsim ../ESCSim \
            --sitl ../obj/ARK32_AM32_SITL_CAN_*.elf
      - name: Run adapter and native state protocol regressions
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          upstream-venv/bin/python -m pytest -q \
            Mcu/SITL/tests/test_upstream_adapter.py Mcu/SITL/tests/test_state_protocol.py \
            Mcu/SITL/tests/test_dshot_programming.py \
            --sitl "$GITHUB_WORKSPACE"/obj/ARK32_AM32_SITL_CAN_*.elf
      - name: Upload upstream test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sitl-${{ matrix.os }}-${{ matrix.sanitizer || 'normal' }}
          path: upstream_test_run/sitl_ci.log
          if-no-files-found: warn

  gui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libfontconfig1 libxkbcommon0

      - uses: ./.github/actions/setup-eeprom

      - name: Build SITL
        run: make AM32_SITL_CAN

      - name: Create GUI environment
        run: python3 Mcu/SITL/make_gui_env.py

      - name: Run GUI test (offscreen)
        run: |
          mkdir gui_test_run && cd gui_test_run
          python3 ../Mcu/SITL/gui_ci_test.py \
            --gui-python ../Mcu/SITL/venv/bin/python3 \
            --sitl ../obj/ARK32_AM32_SITL_CAN_*.elf

      - name: Upload SITL log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-log
          path: gui_test_run/sitl_ci.log
          if-no-files-found: ignore
