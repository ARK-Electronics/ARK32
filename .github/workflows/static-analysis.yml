name: Static analysis

on:
  push:
    branches: [main, ark-release]
  pull_request:
  workflow_dispatch:

jobs:
  format:
    name: clang-format (check_format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          python3 -m pip install --user 'clang-format==22.1.5'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          clang-format --version

      - name: Check formatting
        run: make check_format

  cppcheck:
    name: cppcheck (ARK F051 control path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck --version

      - name: Run cppcheck
        run: make cppcheck

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-ark-report
          path: obj/cppcheck-ark.txt
          if-no-files-found: ignore
          retention-days: 14

  size-ark:
    name: size gate (ARK F051 + HWCI_PERF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Arm toolchain
        uses: ./.github/actions/setup-arm-sdk

      - name: Build ARK + size check
        run: make size-check-ark -j$(nproc)

      - name: Upload ARK binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ark-f051-hwci-perf
          path: |
            obj/ARK32_ARK_4IN1_F051_*.elf
            obj/ARK32_ARK_4IN1_F051_*.bin
          if-no-files-found: ignore
          retention-days: 14

  codegen-ark:
    name: codegen invariants (ARK F051 LTO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Arm toolchain
        uses: ./.github/actions/setup-arm-sdk

      # Guards the two things LTO breaks without failing a build or a test:
      # RAM_FUNC hot paths inlined back into flash, and .file_name /
      # .app_signature emptied by dead-code elimination.
      - name: Build ARK + codegen check
        run: make codegen-check-ark -j$(nproc)

  # Production full-flash images (BL + app + factory EEPROM). Fails if the
  # flash layout or ARK ship defaults regress. See factory/README.md.
  # Covers ARK_4IN1_F051 (32 KiB + committed BL) and ARK_G431_CAN (128 KiB
  # + committed AM32_G431_BOOTLOADER_ARKG4_CAN under Bootloaders/).
  factory-image:
    name: factory image (ARK 4IN1 + G431 CAN)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Arm toolchain
        uses: ./.github/actions/setup-arm-sdk

      - name: Build + verify factory full-flash images
        run: make factory-image-check -j$(nproc)

      - name: Upload factory artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ark-factory-images
          path: |
            obj/ARK32_ARK_4IN1_F051_*.factory.bin
            obj/ARK32_ARK_4IN1_F051_*.factory.hex
            obj/ARK32_ARK_4IN1_F051_*.eeprom.bin
            obj/ARK32_ARK_G431_CAN_*.factory.bin
            obj/ARK32_ARK_G431_CAN_*.factory.hex
            obj/ARK32_ARK_G431_CAN_*.eeprom.bin
            obj/*.uavcan.bin
          if-no-files-found: error
          retention-days: 30

  # Keep ARK_G431_CAN building under LTO so shared control-path PRs cannot
  # silently break the 12S CAN target (no size gate yet — flash is ample).
  build-ark-g431-can:
    name: build ARK_G431_CAN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Arm toolchain
        run: |
          make arm_sdk_install
          make arm_sdk_check

      - name: Build ARK_G431_CAN
        run: make ARK_G431_CAN -j$(nproc)

      - name: Upload G431 CAN binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ark-g431-can
          path: |
            obj/AM32_ARK_G431_CAN_*.elf
            obj/AM32_ARK_G431_CAN_*.bin
            obj/AM32_ARK_G431_CAN_*.hex
            obj/*.uavcan.bin
          if-no-files-found: ignore
          retention-days: 14
